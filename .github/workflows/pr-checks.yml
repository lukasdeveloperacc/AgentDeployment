name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Job 1: Code Quality
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Run Ruff (linting)
        run: |
          cd backend
          ruff check . --output-format=github

      - name: Run Black (formatting check)
        run: |
          cd backend
          black --check .

      - name: Run MyPy (type checking)
        run: |
          cd backend
          mypy . --ignore-missing-imports
        continue-on-error: true

  # Job 2: Security Scan
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 3: Tests
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Run tests with coverage
        run: |
          cd backend
          pytest tests/ --verbose --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  # Job 4: Docker Build Test
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 5: PR Size Check
  pr-size:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const changes = additions + deletions;

            if (changes > 500) {
              core.setFailed(`PR is too large (${changes} lines changed). Consider breaking it into smaller PRs.`);
            }

  # Job 6: PR Summary
  summary:
    needs: [code-quality, security, tests, docker-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: PR Check Summary
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = [
              { name: 'Code Quality', result: '${{ needs.code-quality.result }}' },
              { name: 'Security', result: '${{ needs.security.result }}' },
              { name: 'Tests', result: '${{ needs.tests.result }}' },
              { name: 'Docker Build', result: '${{ needs.docker-build.result }}' }
            ];

            let summary = '## 🔍 Pull Request Checks Summary\n\n';

            jobs.forEach(job => {
              const icon = job.result === 'success' ? '✅' : '❌';
              summary += `${icon} **${job.name}**: ${job.result}\n`;
            });

            const allPassed = jobs.every(job => job.result === 'success');

            if (allPassed) {
              summary += '\n✅ All checks passed! Ready for review.';
            } else {
              summary += '\n❌ Some checks failed. Please fix the issues before merging.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
